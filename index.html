<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryQuest Academy</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- External Stories JS -->
  <script src="stories.js"></script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Import from the globally loaded stories.js file
    const storyData = window.storyData || [];

    const Confetti = () => {
      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-50">
          {[...Array(50)].map((_, i) => (
            <div
              key={i}
              className="absolute w-3 h-3 rounded-full"
              style={{
                backgroundColor: ['#ffeb3b', '#ff4081', '#00e5ff', '#b2ff59', '#e040fb'][Math.floor(Math.random() * 5)],
                left: `${Math.random() * 100}vw`,
                top: `-20px`,
                animation: `fall ${Math.random() * 3 + 2}s linear infinite`,
                animationDelay: `${Math.random() * 2}s`
              }}
            />
          ))}
        </div>
      );
    };

    function App() {
      const [view, setView] = useState('dashboard');
      const [currentStoryId, setCurrentStoryId] = useState(null);
      const [questionIndex, setQuestionIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [xp, setXp] = useState(0);
      const [unlockedLevels, setUnlockedLevels] = useState([1]);
      const [storyScores, setStoryScores] = useState({});
      
      const [selectedOption, setSelectedOption] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [attempts, setAttempts] = useState(0);

      useEffect(() => {
        const savedProgress = localStorage.getItem('storyQuestProgress');
        if (savedProgress) {
          const parsed = JSON.parse(savedProgress);
          setUnlockedLevels(parsed.unlockedLevels || [1]);
          setXp(parsed.xp || 0);
          setScore(parsed.score || 0);
          setStoryScores(parsed.storyScores || {});
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('storyQuestProgress', JSON.stringify({
          unlockedLevels,
          xp,
          score,
          storyScores
        }));
      }, [unlockedLevels, xp, score, storyScores]);

      const level = Math.floor(xp / 100) + 1;
      const xpProgress = xp % 100;
      const currentStory = storyData.find(s => s.id === currentStoryId);

      const openStory = (id) => {
        if (unlockedLevels.includes(id)) {
          setCurrentStoryId(id);
          setQuestionIndex(0);
          setSelectedOption(null);
          setFeedback(null);
          setAttempts(0);
          setView('story');
        }
      };

      const handleOptionClick = (optIndex) => {
        if (feedback === 'correct') return;

        setSelectedOption(optIndex);
        const isCorrect = optIndex === currentStory.questions[questionIndex].a;

        if (isCorrect) {
          setFeedback('correct');
          let pointsEarned = 10;
          if (attempts === 1) pointsEarned = 7;
          if (attempts >= 2) pointsEarned = 5;
          
          setScore(prev => prev + pointsEarned);
          setXp(prev => prev + (pointsEarned * 2));

          setTimeout(() => {
            if (questionIndex < currentStory.questions.length - 1) {
              setQuestionIndex(prev => prev + 1);
              setSelectedOption(null);
              setFeedback(null);
              setAttempts(0);
            } else {
              handleStoryComplete();
            }
          }, 2000);
        } else {
          setFeedback('incorrect');
          setAttempts(prev => prev + 1);
        }
      };

      const handleStoryComplete = () => {
        if (currentStoryId < storyData.length && !unlockedLevels.includes(currentStoryId + 1)) {
          setUnlockedLevels(prev => [...prev, currentStoryId + 1]);
        }
        setStoryScores(prev => ({
          ...prev,
          [currentStoryId]: true
        }));
        setView('result');
      };

      const goHome = () => {
        setView('dashboard');
        setCurrentStoryId(null);
      };

      if (view === 'dashboard') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4 md:p-8 font-sans text-white">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center bg-white/10 backdrop-blur-md rounded-3xl p-6 shadow-2xl border border-white/20 mb-8">
              <div className="flex items-center gap-4 mb-4 md:mb-0">
                <div className="w-16 h-16 bg-yellow-400 rounded-full flex items-center justify-center border-4 border-white shadow-lg">
                  <i className="fa-solid fa-trophy text-yellow-600 text-3xl"></i>
                </div>
                <div>
                  <h1 className="text-3xl font-bold tracking-wider">StoryQuest Academy</h1>
                  <p className="text-blue-100 font-medium tracking-wide">Reader Level: {level}</p>
                </div>
              </div>
              <div className="flex gap-6">
                <div className="bg-black/20 px-6 py-3 rounded-2xl flex flex-col items-center">
                  <span className="text-xs uppercase font-bold text-yellow-300 tracking-wider">Total Score</span>
                  <span className="text-2xl font-black flex items-center gap-2">
                    <i className="fa-solid fa-star text-yellow-400"></i> {score}
                  </span>
                </div>
                <div className="bg-black/20 px-6 py-3 rounded-2xl flex flex-col items-center min-w-[150px]">
                  <span className="text-xs uppercase font-bold text-green-300 tracking-wider">XP to next level</span>
                  <div className="w-full bg-black/30 h-3 rounded-full mt-2 relative overflow-hidden">
                    <div 
                      className="absolute top-0 left-0 h-full bg-gradient-to-r from-green-400 to-green-300 transition-all duration-500 rounded-full"
                      style={{ width: `${xpProgress}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            </div>

            <div className="max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6 pb-12">
              {storyData.map((story) => {
                const isUnlocked = unlockedLevels.includes(story.id);
                const isCompleted = storyScores[story.id];
                
                return (
                  <button
                    key={story.id}
                    onClick={() => openStory(story.id)}
                    disabled={!isUnlocked}
                    className={`relative group flex flex-col items-center justify-center p-6 rounded-3xl transition-all duration-300 shadow-xl border-4 ${
                      isUnlocked 
                        ? 'bg-white text-indigo-900 border-white hover:-translate-y-2 hover:shadow-2xl hover:border-yellow-400 cursor-pointer' 
                        : 'bg-white/20 text-white/50 border-transparent cursor-not-allowed backdrop-blur-sm'
                    }`}
                  >
                    {isCompleted && (
                      <div className="absolute -top-3 -right-3 bg-green-500 rounded-full p-2 shadow-lg border-2 border-white z-10 flex items-center justify-center">
                        <i className="fa-solid fa-circle-check text-white text-lg"></i>
                      </div>
                    )}
                    
                    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 shadow-inner ${isUnlocked ? 'bg-indigo-100' : 'bg-black/20'}`}>
                      {isUnlocked ? (
                        <i className={`fa-solid fa-book-open text-3xl ${isCompleted ? 'text-green-500' : 'text-indigo-500'}`}></i>
                      ) : (
                        <i className="fa-solid fa-lock text-3xl"></i>
                      )}
                    </div>
                    <div className="text-center font-bold">
                      <span className="block text-xs uppercase text-gray-400 mb-1 font-black tracking-widest">Story {story.id}</span>
                      <span className={`block leading-tight ${isUnlocked ? 'text-gray-800' : ''}`}>{story.title}</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      }

      if (view === 'story' && currentStory) {
        const currentQ = currentStory.questions[questionIndex];

        return (
          <div className="min-h-screen bg-slate-50 flex flex-col font-sans">
            <div className="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
              <button onClick={goHome} className="flex items-center gap-2 text-indigo-600 font-bold hover:bg-indigo-50 px-4 py-2 rounded-xl transition-colors">
                <i className="fa-solid fa-house"></i> Back to Map
              </button>
              <div className="flex gap-2">
                {[...Array(currentStory.questions.length)].map((_, i) => (
                  <div 
                    key={i} 
                    className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-all duration-300 ${
                      i < questionIndex ? 'bg-green-500 text-white shadow-md' :
                      i === questionIndex ? 'bg-yellow-400 text-yellow-900 shadow-lg ring-4 ring-yellow-200 scale-110' :
                      'bg-gray-200 text-gray-400'
                    }`}
                  >
                    {i + 1}
                  </div>
                ))}
              </div>
            </div>

            <div className="flex-1 flex flex-col lg:flex-row max-w-7xl mx-auto w-full p-4 lg:p-8 gap-8">
              
              <div className="w-full lg:w-1/2 flex flex-col">
                <div className="bg-white rounded-3xl shadow-xl border-t-8 border-indigo-400 p-8 flex-1 lg:sticky lg:top-28">
                  <div className="flex items-center gap-4 mb-6">
                    <div className="bg-indigo-100 p-3 rounded-2xl">
                      <i className="fa-solid fa-book-open text-2xl text-indigo-600"></i>
                    </div>
                    <h2 className="text-3xl font-black text-slate-800">{currentStory.title}</h2>
                  </div>
                  <p className="text-xl md:text-2xl leading-relaxed text-slate-700 font-medium bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-inner">
                    {currentStory.content}
                  </p>
                </div>
              </div>

              <div className="w-full lg:w-1/2 flex flex-col">
                <div className="bg-white rounded-3xl shadow-xl border-t-8 border-pink-400 p-8 flex-1">
                  <h3 className="text-sm font-black tracking-widest text-pink-500 uppercase mb-4">Question {questionIndex + 1} of {currentStory.questions.length}</h3>
                  <p className="text-2xl md:text-3xl font-bold text-slate-800 mb-8 leading-snug">
                    {currentQ.q}
                  </p>

                  <div className="space-y-4">
                    {currentQ.options.map((opt, idx) => {
                      let btnClass = "w-full text-left p-6 rounded-2xl border-4 text-xl font-semibold transition-all duration-200 flex items-center justify-between ";
                      
                      if (selectedOption === idx) {
                        if (feedback === 'correct') {
                          btnClass += "bg-green-100 border-green-500 text-green-800 shadow-lg scale-[1.02]";
                        } else if (feedback === 'incorrect') {
                          btnClass += "bg-red-50 border-red-400 text-red-700 animate-[shake_0.5s_ease-in-out]";
                        }
                      } else if (feedback === 'correct' && idx === currentQ.a) {
                        btnClass += "bg-green-100 border-green-500 text-green-800";
                      } else if (feedback === 'correct') {
                         btnClass += "bg-white border-slate-100 text-slate-300 opacity-50";
                      } else {
                        btnClass += "bg-white border-slate-200 text-slate-600 hover:border-indigo-300 hover:shadow-md hover:bg-indigo-50 active:scale-95 cursor-pointer";
                      }

                      return (
                        <button 
                          key={idx}
                          onClick={() => handleOptionClick(idx)}
                          disabled={feedback === 'correct'}
                          className={btnClass}
                        >
                          <span>{opt}</span>
                          {selectedOption === idx && feedback === 'correct' && <i className="fa-solid fa-circle-check text-green-500 text-2xl ml-4 flex-shrink-0"></i>}
                          {selectedOption === idx && feedback === 'incorrect' && <i className="fa-solid fa-circle-xmark text-red-500 text-2xl ml-4 flex-shrink-0"></i>}
                        </button>
                      );
                    })}
                  </div>

                  {feedback === 'incorrect' && (
                    <div className="mt-6 bg-orange-50 border-l-4 border-orange-400 p-4 rounded-r-xl flex items-start gap-4 animate-[fadeIn_0.3s_ease-in-out]">
                      <i className="fa-solid fa-wand-magic-sparkles text-orange-500 text-xl flex-shrink-0 mt-1"></i>
                      <p className="text-lg text-orange-800 font-medium">
                        Not quite! Let's read the story one more time on the left to find the clue. You can do it!
                      </p>
                    </div>
                  )}
                  {feedback === 'correct' && (
                    <div className="mt-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-r-xl flex items-start gap-4 animate-[fadeIn_0.3s_ease-in-out]">
                      <i className="fa-solid fa-award text-green-600 text-xl flex-shrink-0 mt-1"></i>
                      <p className="text-lg text-green-800 font-bold">
                        Fantastic job! You found the right answer!
                      </p>
                    </div>
                  )}

                </div>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'result') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-300 via-orange-400 to-red-500 flex items-center justify-center p-4 font-sans text-center">
            <Confetti />
            <div className="bg-white/95 backdrop-blur-md rounded-[3rem] p-10 md:p-16 max-w-2xl w-full shadow-2xl relative border-8 border-white mt-16">
              <div className="absolute -top-16 left-1/2 transform -translate-x-1/2">
                <div className="bg-gradient-to-b from-yellow-300 to-yellow-500 w-32 h-32 rounded-full border-8 border-white flex items-center justify-center shadow-xl">
                  <i className="fa-solid fa-star text-white text-5xl"></i>
                </div>
              </div>
              
              <h2 className="text-4xl md:text-5xl font-black text-slate-800 mt-12 mb-4">Story Complete!</h2>
              <p className="text-2xl text-slate-600 mb-8 font-medium">You are an amazing reader!</p>
              
              <div className="bg-slate-100 rounded-3xl p-8 mb-8 inline-block shadow-inner">
                <span className="block text-sm uppercase tracking-widest font-bold text-slate-400 mb-2">You earned</span>
                <div className="text-5xl font-black text-green-500 flex items-center justify-center gap-2">
                   +100 XP
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-4 justify-center">
                <button 
                  onClick={goHome}
                  className="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold rounded-2xl shadow-lg hover:shadow-xl transition-all hover:-translate-y-1 flex items-center justify-center gap-2"
                >
                  <i className="fa-solid fa-house"></i> Go to Map
                </button>
                {currentStoryId < storyData.length && (
                  <button 
                    onClick={() => openStory(currentStoryId + 1)}
                    className="px-8 py-4 bg-green-500 hover:bg-green-600 text-white text-xl font-bold rounded-2xl shadow-lg hover:shadow-xl transition-all hover:-translate-y-1 flex items-center justify-center gap-2"
                  >
                    Next Story <i className="fa-solid fa-chevron-right"></i>
                  </button>
                )}
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
